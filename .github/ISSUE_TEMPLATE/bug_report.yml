name: Bug report
description: Report a reproducible problem in the app, tooling, or documentation.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include credentials or private data here. Use the private process in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the smallest safe input and exact steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: Commit SHA or release tag
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node.js version, and relevant assistive technology.
